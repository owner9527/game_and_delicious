  ctx.strokeStyle="rgba(0,0,0,.85)"; ctx.lineWidth=2.4;
  ctx.strokeText(s,x,y+CELL*.44);
  ctx.shadowColor="rgba(255,210,110,.9)"; ctx.shadowBlur=6;
  ctx.fillStyle="#ffd45a"; ctx.fillText(s,x,y+CELL*.44);
  ctx.restore();
}
function drawOwnedBoard(){
  for(const [key,u] of Object.entries(G.board)){
    const [c,r]=key.split(",").map(Number);
    const x=PAD+c*CELL,y=PAD+r*CELL;
    const sel=G.sel&&G.sel.loc==="board"&&G.sel.w===key;
    drawUnitAt(u,x+CELL/2,y+CELL/2,{sel,team:"player"});
    if(sel){
      // 射程指示（虚线 + 柔光）
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      const rr=(u.def.range+.45)*CELL, cx0=x+CELL/2, cy0=y+CELL/2;
      ctx.strokeStyle="rgba(120,200,255,.45)"; ctx.setLineDash([4,4]);
      ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(cx0,cy0,rr,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=rg(ctx,"rangeFill",0,0,0,0,0,1,[[0,"rgba(120,200,255,.16)"],[1,"rgba(120,200,255,0)"]]);
      ctx.save(); ctx.translate(cx0,cy0); ctx.scale(rr,rr);
      ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.restore();
    }
  }
}
/* 棋子：底盘 + 立绘 + 星级（不再使用方块与 emoji） */
function drawUnitAt(u,cx,cy,opt){
  opt=opt||{};
  const def=u.def||u;
  drawUnitBase(ctx,cx,cy,def.cost,opt.team||"player",!!opt.sel);
  drawHeroFigure(ctx,def,cx,cy+CELL*.19,CELL*.62,
    {face:(opt.team==="enemy")?-1:1,team:opt.team||"player",flash:opt.flash||0,glow:opt.glow||0});
  drawStar(cx,cy,u.star||1);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------------- 战斗渲染 ---------------- */
function buPix(u){
  let x=uPX(u.c), y=uPY(u.r);
  if(u.mvFrom&&u.mvTo){
    const t=clamp(u.moveT,0,1);
    x=uPX(u.mvFrom.c)+(uPX(u.mvTo.c)-uPX(u.mvFrom.c))*t;
    y=uPY(u.mvFrom.r)+(uPY(u.mvTo.r)-uPY(u.mvFrom.r))*t;
  }
  if(u.lunge>0&&u.target&&!u.target.dead){
    const k=u.lunge/.18*.35;
    x+=(uPX(u.target.c)-x)*k*.3; y+=(uPY(u.target.r)-y)*k*.3;
  }
  return {x,y};
}
function drawBattle(){
  const B=G.battle;
  // 单位
  B.units.forEach(u=>{
    if(u.dead) return;
    const {x,y}=buPix(u);
    const half=CELL*.38;
    const hit=Math.max(0,1-(B.time-(u.hitT===undefined?-9:u.hitT))/.16);          // 命中闪白
    const cast=Math.max(0,1-(B.time-(u.castT===undefined?-9:u.castT))/.40);       // 施法光晕
    ctx.save();
    // 施法者脚下魔法阵（radialGradient + lighter）
    if(cast>0){
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=cast*.85;
      const rr0=(1.5-cast)*CELL*.9;
      ctx.strokeStyle="#9db8ff"; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.ellipse(x,y+CELL*.22,rr0,rr0*.42,0,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle="rgba(220,235,255,.8)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(x,y+CELL*.22,rr0*.72,rr0*.30,0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    drawUnitBase(ctx,x,y,u.def.cost,u.team,false);
    // 护盾泡
    if(u.shield>0){
      const sr=clamp(u.shield/u.maxHp,0,1);
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=.20+sr*.35;
      ctx.fillStyle=rg(ctx,"shieldBub",0,0,0,0,0,1,[[0,"rgba(190,220,255,.10)"],[.72,"rgba(150,190,255,.18)"],[1,"rgba(220,240,255,.55)"]]);
      ctx.save(); ctx.translate(x,y+CELL*.12); ctx.scale(CELL*.34,CELL*.40);
      ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.restore();
    }
    drawHeroFigure(ctx,u.def,x,y+CELL*.19,CELL*.62,
      {face:u.face,team:u.team,flash:hit,glow:cast*.9});
    drawStar(x,y,u.star);
    // 眩晕标记（绘制旋风，不再用 emoji）
    if(isStunned(u,B.time)){
      const sx=x+half*.72, sy=y-half*.78, a=B.time*7;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); ctx.globalCompositeOperation="lighter";
      ctx.strokeStyle="rgba(255,225,150,.95)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,5.5,0,Math.PI*1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,2.6,Math.PI,Math.PI*2.5); ctx.stroke();
      ctx.fillStyle="#ffe9a8"; ctx.beginPath(); ctx.arc(0,0,1.6,0,6.3); ctx.fill();
      ctx.restore();
    }
    // 血条（渐变 + 内高光 + 描边）/ 护盾 / 法力条
    const bw=half*2.0,bx=x-bw/2,by=y-half-11;
    const hpr=clamp(u.hp/u.maxHp,0,1);
    ctx.save(); ctx.translate(bx,by);   // 平移到条起点，保证缓存渐变的坐标系稳定
    ctx.fillStyle="rgba(4,6,14,.85)"; roundRectOn(ctx,-1,-1,bw+2,7,3); ctx.fill();
    ctx.fillStyle=lg(ctx,hpr>.5?"hpg":"hpr",0,0,bw,0,
      hpr>.5?[[0,"#8ff0a8"],[.5,"#4fbf72"],[1,"#2a8a52"]]:(hpr>.25?[[0,"#ffd98a"],[.5,"#e8b14a"],[1,"#a8781f"]]:[[0,"#ff9a8a"],[.5,"#e05555"],[1,"#a02a3a"]]));
    roundRectOn(ctx,0,0,bw*hpr,5,2.5); ctx.fill();
    ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle="#ffffff";
    roundRectOn(ctx,0,0,bw*hpr,2,1); ctx.fill(); ctx.restore();
    if(u.shield>0){
      const shr=clamp(u.shield/u.maxHp,0,1);
      ctx.fillStyle="rgba(215,232,255,.92)";
      ctx.fillRect(bw*hpr,0,bw*shr,5);
      ctx.strokeStyle="rgba(205,225,255,.85)"; ctx.lineWidth=1;
      roundRectOn(ctx,-1.5,-1.5,bw+3,8,3); ctx.stroke(); ctx.lineWidth=1;
    }
    ctx.strokeStyle="rgba(12,16,30,.9)"; ctx.lineWidth=1;
    roundRectOn(ctx,-1,-1,bw+2,7,3); ctx.stroke();
    const mr=clamp(u.mana/u.manaMax,0,1);
    ctx.fillStyle="rgba(4,6,14,.8)"; roundRectOn(ctx,0,7,bw,4,2); ctx.fill();
    if(mr>=1){ ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.shadowColor="#ffe07a"; ctx.shadowBlur=8; }
    ctx.fillStyle=mr>=1?"#ffe07a":"#4f8fe8";
    roundRectOn(ctx,0,7,bw*mr,4,2); ctx.fill();
    if(mr>=1) ctx.restore();
    ctx.restore();
    ctx.restore();
  });
  // 弹道（发光箭矢 + 拖尾）
  B.projectiles.forEach(pr=>{
    const ang=Math.atan2(pr.ty-pr.y,pr.tx-pr.x);
    ctx.save();
    ctx.translate(pr.x,pr.y); ctx.rotate(ang);
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=lg(ctx,"bolt",-22,0,6,0,[[0,"rgba(255,180,90,0)"],[.6,"rgba(255,190,110,.45)"],[1,"rgba(255,240,200,.95)"]]);
    ctx.beginPath(); ctx.ellipse(-8,0,14,3.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rg(ctx,"bolthead",0,0,0,0,0,1,[[0,"rgba(255,255,255,1)"],[.35,"rgba(255,214,140,.75)"],[1,"rgba(255,150,60,0)"]]);
    ctx.save(); ctx.scale(9,9); ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.restore();
  });
  // 特效：冲击波圆环 / 命中光斑 / 击杀碎裂粒子 / 施法爆发
  B.fx.forEach(f=>{
    const k=clamp(f.t/f.dur,0,1), fade=1-k;
    if(f.type==="ring"){
      const rr=18+(f.radius||1)*CELL*k;
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=fade*.55;
      ctx.fillStyle=rg(ctx,"ringFill",0,0,0,0,0,1,[[0,"rgba(255,255,255,0)"],[.7,hexA2(f.color,.35)],[1,"rgba(255,255,255,0)"]]);
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(rr,rr*.72);
      ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.globalAlpha=fade;
      ctx.strokeStyle=f.color; ctx.lineWidth=3.2*(1-k)+1;
      ctx.beginPath(); ctx.ellipse(f.x,f.y,rr,rr*.72,0,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=fade*.7; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.ellipse(f.x,f.y,rr*.68,rr*.49,0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }else if(f.type==="die"){
      // 击杀：碎裂粒子 + 扩散环
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=fade;
      ctx.strokeStyle=f.color; ctx.lineWidth=3*(1-k)+1;
      ctx.beginPath(); ctx.arc(f.x,f.y,10+k*30,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=fade*.6;
      ctx.fillStyle=rg(ctx,"dieFill",0,0,0,0,0,1,[[0,hexA2(f.color,.55)],[1,"rgba(255,255,255,0)"]]);
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(24*(1-k*.4),24*(1-k*.4));
      ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.restore();
    }else if(f.type==="burst"){
      // 命中光斑：放射状亮斑
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=fade*.9;
      ctx.fillStyle=rg(ctx,"burstFill",0,0,0,0,0,1,[[0,"rgba(255,255,255,.95)"],[.4,hexA2(f.color,.6)],[1,"rgba(255,255,255,0)"]]);
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(6+k*(f.r||22),6+k*(f.r||22));
      ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.strokeStyle="#ffffff"; ctx.lineWidth=1.6*(1-k);
      const n=6;
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2+f.seed;
        ctx.beginPath(); ctx.moveTo(f.x+Math.cos(a)*4,f.y+Math.sin(a)*4);
        ctx.lineTo(f.x+Math.cos(a)*(10+k*22),f.y+Math.sin(a)*(10+k*22)); ctx.stroke();
      }
      ctx.restore();
    }else if(f.type==="p"){
      // 粒子（速度在绘制时按 t 积分，无状态、不含累积误差）
      const px=f.x+f.vx*f.t, py=f.y+f.vy*f.t+.5*f.grav*f.t*f.t;
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=fade;
      ctx.fillStyle=f.color;
      ctx.beginPath(); ctx.arc(px,py,f.r*fade+.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
  // 飘字：上浮 + 淡出 + 弹出缩放 + 外发光
  B.texts.forEach(t=>{
    const k=clamp(t.t/0.9,0,1);
    const pop=1+Math.max(0,.35-k)*0.6;
    ctx.save();
    ctx.font="900 "+(13*t.scale*pop)+"px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    const tx=t.x+(t.sx||0)*t.t*26, ty=t.y-t.t*40;
    ctx.globalAlpha=Math.min(1,(1-k)*1.8);
    ctx.strokeStyle="rgba(6,8,18,.9)"; ctx.lineWidth=3.4;
    ctx.strokeText(t.txt,tx,ty);
    ctx.shadowColor=t.color; ctx.shadowBlur=8;
    ctx.fillStyle=t.color; ctx.fillText(t.txt,tx,ty);
    ctx.restore();
  });
  // 顶部信息
  const pa=B.units.filter(u=>u.team==="player"&&!u.dead).length;
  const ea=B.units.filter(u=>u.team==="enemy"&&!u.dead).length;
  ctx.save();
  ctx.font="12px 'Microsoft YaHei'"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="rgba(4,6,16,.55)"; roundRectOn(ctx,W/2-108,3,216,18,9); ctx.fill();
  ctx.fillStyle="rgba(220,232,255,.92)";
  let info=`我方 ${pa}  vs  敌方 ${ea}`;
  if(B.time>B.sudden) info+=`  ⚠ 突然死亡 ${Math.max(0,Math.ceil(75-B.time))}s`;
  ctx.fillText(info,W/2,12);
  ctx.restore();
}

/* ---------------- 主循环 ---------------- */
let lastT=0;
function loop(t){
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  ART.t+=dt; ART.dt=dt;
  // 背景远景以约 24fps 重绘（运动极慢，肉眼看不出差别，省一半以上开销）
  BGFX.acc+=dt;
  if(BGFX.acc>=1/24){ drawBgScene(BGFX.acc); BGFX.acc=0; }
  if(G.phase==="battle"&&G.battle){
    const steps=G.speed;
    for(let i=0;i<steps;i++) battleUpdate(dt);
    drawBoard(); drawBattle();
  }else{
    drawBoard(); drawOwnedBoard();
  }
  requestAnimationFrame(loop);
}
bakeBackground();
requestAnimationFrame(loop);

    <p><b>羁绊：</b>每个英雄有种族与职业。棋盘上凑齐同种族/同职业的一定数量即激活羁绊加成，羁绊按<b>不同英雄</b>计数。左侧面板实时显示。</p>
    <p><b>升星：</b>3 个相同 1★ 自动合成 2★，3 个 2★ 合成 3★。</p>
    <p><b>操作：</b>拖拽布阵；拖到右下「卖出区」出售；「一键上阵」快速布阵；战斗中点击棋盘单位可查看实时状态；开战后可加速。</p>
    <p><b>长线：</b>图鉴记录你收集过的英雄与最高星级；最远波次与最高连胜自动保存。</p>
    <div class="closeRow"><button class="mBtn" id="mClose">关 闭</button></div>`);
  $("mClose").onclick=closeModal;
}
function openBook(){
  const cells=HEROES.map(h=>{
    const got=saveData.collection[h.id]||0;
    const sk=SKILLS[h.skill];
    return `<div class="heroCell ${got?"":"lock"}" style="--rc:${got?COST_COLOR[h.cost]:"var(--line)"}">
      ${icoHTML(h,got||1,"player")}
      <div class="hNm">${h.name}</div>
      <div class="hMeta">${h.race}·${h.cls} · 💰${h.cost}</div>
      <div class="hSkill"><b style="color:var(--gold)">${sk.name}</b></div>
      <div class="hStar">${got?"★".repeat(got)+" 已收集":"未收集"}</div>
    </div>`;
  }).join("");
  const n=Object.keys(saveData.collection).length;
  openModal(`<h2>英雄图鉴 · 收集 ${n}/${HEROES.length}</h2>
    ${n>=HEROES.length?'<p style="text-align:center"><b>🏆 全图鉴达成！获得称号「幻境收藏家」</b></p>':""}
    <div class="heroGrid">${cells}</div>
    <div class="closeRow"><button class="mBtn" id="mClose">关 闭</button></div>`);
  $("mClose").onclick=closeModal;
}
function openModal(html){
  $("modalBody").innerHTML=html;
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); }
function wireTabs(){
  [...document.querySelectorAll("#modalBody .tab")].forEach(t=>{
    t.onclick=()=>{
      [...document.querySelectorAll("#modalBody .tab")].forEach(x=>x.classList.remove("on"));
      [...document.querySelectorAll("#modalBody .tabBody")].forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      document.querySelector(`#modalBody .tabBody[data-b="${t.dataset.t}"]`).classList.add("on");
    };
  });
}

/* ---------------- 开局 ---------------- */
function startGame(){
  G.phase="prep"; G.round=1; G.hp=100; G.gold=10; G.level=3; G.xp=0; G.streak=0;
  G.bench=new Array(9).fill(null); G.board={}; G.shop=[null,null,null,null,null];
  G.sel=null; G.battle=null; G.speed=1;
  $("btnSpeed").style.display="none"; $("btnSpeed").textContent="▶ x1";
  $("btnFight").style.display=""; $("btnAuto").style.display=""; $("btnRecall").style.display="";
  rollShop(); renderAll(); updateEnemyPreview();
  $("menu").classList.remove("show");
  if(!saveData.tutorialSeen) openTutorial();
}

/* ---------------- 事件绑定 ---------------- */
$("btnStart").onclick=()=>{ ac(); startGame(); };
$("btnFight").onclick=()=>{ ac(); startBattle(); };
$("btnRefresh").onclick=()=>refreshShop(false);
$("btnXp").onclick=buyXp;
$("btnAuto").onclick=autoPlace;
$("btnRecall").onclick=recallAll;
$("btnHelp").onclick=openHelp;
$("btnGuide").onclick=openGuide;
$("btnBook").onclick=openBook;
$("btnMute").onclick=()=>{
  saveData.muted=!saveData.muted; persist();
  $("btnMute").textContent=saveData.muted?"🔇":"🔊";
};
$("btnSpeed").onclick=()=>{
  G.speed=G.speed===1?2:G.speed===2?3:1;
  $("btnSpeed").textContent="▶ x"+G.speed;
};
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
$("btnMute").textContent=saveData.muted?"🔇":"🔊";

// 轮播提示
let tipI=0;
setInterval(()=>{
  $("tipTxt").textContent=TIPS[tipI%TIPS.length]; tipI++;
},6000);
$("tipTxt").textContent=TIPS[0];

// 菜单记录
$("recStage").textContent=saveData.bestStage?saveData.bestStage+"/"+STAGES.length:"-";
$("recStreak").textContent=saveData.bestStreak||"-";
$("recColl").textContent=Object.keys(saveData.collection).length+"/"+HEROES.length;

// 胶片颗粒层：复用预生成的噪点贴图（同一张离屏 canvas 转出的 dataURL，零额外素材）
$("grain").style.backgroundImage="url("+GRAIN_URL+")";

renderAll();

/* ---------------- 调试工具（控制台可用） ---------------- */
G.debug={
  win(){ if(G.battle){ G.battle.units.forEach(u=>{ if(u.team==="enemy") killUnit(u,null); }); } },
  lose(){ if(G.battle){ G.battle.units.forEach(u=>{ if(u.team==="player") killUnit(u,null); }); } },
  gold(n){ G.gold+=n; renderAll(); },
  hp(n){ G.hp=n; renderAll(); },
  level(n){ G.level=n; G.xp=0; renderAll(); },
  give(id,star){ const i=G.bench.findIndex(x=>!x); if(i>=0){ G.bench[i]=mkUnit(id,star||1); tryMerge(); renderAll(); } },
  skip(){ if(G.phase==="prep"){ G.round=Math.min(STAGES.length,G.round+1); rollShop(); renderAll(); updateEnemyPreview(); } },
};
</script>
</body>
</html>
